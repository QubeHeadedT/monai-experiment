    "mlflow>=3.16.1",
    "monai>=1.5",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "sagemaker-mlflow>=0.5.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false

